# Render Blueprint for the Ron Poker referee service (free plan).
# MASTER_SECRET is generated by Render and never leaves it: every key the referee
# and the AI players use is derived from it on the server.
services:
  - type: web
    name: ron-poker-referee
    runtime: node
    plan: free
    region: singapore
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.mjs
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: MASTER_SECRET
        generateValue: true
      - key: CONTRACT_ID
        value: ronpoker-5a0mg.testnet
      - key: NODE_VERSION
        value: "22"
      - key: ALLOWED_ORIGINS
        value: https://ponkotsuai.github.io
