[package]
name = "ron-poker-table"
version = "0.1.0"
edition = "2021"
description = "Ron Poker table escrow: buy-ins, all-player signed results, payouts. No house."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk = "=5.24.1"

[dev-dependencies]
near-sdk = { version = "=5.24.1", features = ["unit-testing"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
