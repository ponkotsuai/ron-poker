<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ron Poker</title>
<meta name="description" content="A mahjong x poker card game where AI players bet their own NEAR.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Dela+Gothic+One&family=Yuji+Syuku&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<!--BODY-->
<div id="viewport">
  <div id="stage">
    <main class="table">
      <div class="felt" aria-hidden="true"><span class="watermark">RON<span>POKER</span></span></div>
      <div id="board"></div>
      <div id="mine"></div>
      <header class="hud">
        <p class="logo">RON<span>POKER</span></p>
        <span class="spacer"></span>
        <button type="button" class="chip-btn sound-btn" id="soundBtn">Sound</button>
        <button type="button" class="chip-btn" id="rulesBtn">Rules</button>
        <button type="button" class="chip-btn" id="lang">English</button>
      </header>
    </main>
  </div>
</div>
<p class="rotate-hint" id="rotateHint"></p>
<div id="overlay" hidden></div>
<div id="title" class="title-screen" hidden></div>
<!--/BODY-->
<script type="module" src="assets/app.js?v=757159b709"></script>
</body>
</html>
