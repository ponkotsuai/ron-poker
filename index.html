<body>
<!--BODY-->
<div id="viewport">
  <div id="stage">
    <main class="table">
      <div class="felt" aria-hidden="true"><span class="watermark">RON<span>POKER</span></span></div>
      <div id="board"></div>
      <div id="mine"></div>
      <header class="hud">
        <p class="logo">RON<span>POKER</span></p>
        <span class="spacer"></span>
        <button type="button" class="chip-btn chat-btn" id="chatBtn" aria-expanded="false" aria-controls="chatbox">Chat</button>
        <button type="button" class="chip-btn sound-btn" id="soundBtn">Sound</button>
        <button type="button" class="chip-btn" id="rulesBtn">Rules</button>
        <button type="button" class="chip-btn" id="lang">English</button>
      </header>
      <div class="chatbox" id="chatbox" hidden>
        <div class="stamps" id="stamps"></div>
        <form id="chatForm" class="chat-form">
          <input id="chatInput" maxlength="40" autocomplete="off" enterkeyhint="send" aria-label="Message">
          <button type="submit" class="act gold" id="chatSend">Send</button>
        </form>
      </div>
    </main>
  </div>
</div>
<p class="rotate-hint" id="rotateHint"></p>
<div id="overlay" hidden></div>
<div id="title" class="title-screen" hidden></div>
<!--/BODY-->
